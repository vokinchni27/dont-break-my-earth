<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <title>EARTH — administration</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main>
    <section id="connexion" class="connexion" aria-labelledby="connexion-titre">
      <p class="micro">archive collective · accès privé</p>
      <h1 id="connexion-titre">EARTH<sup>®</sup></h1>
      <form id="connexion-forme">
        <label>adresse email<input id="courriel" type="email" autocomplete="username" required></label>
        <label>mot de passe<input id="mot-de-passe" type="password" autocomplete="current-password" required></label>
        <button class="bouton bouton--plein" type="submit">entrer</button>
        <p id="connexion-erreur" class="message" role="status"></p>
      </form>
    </section>

    <section id="atelier" hidden>
      <header class="entete">
        <div>
          <p class="micro">DON’T BREAK MY EARTH · administration</p>
          <h1>ARCHIVE<br>COLLECTIVE</h1>
        </div>
        <div class="compte">
          <span id="identite" class="micro">—</span>
          <button class="bouton" id="sortir" type="button">quitter</button>
        </div>
      </header>

      <nav class="onglets" aria-label="Sections d’administration">
        <button class="onglet actif" data-vue="propositions" type="button">propositions <span id="nombre-propositions">0</span></button>
        <button class="onglet" data-vue="contenus" type="button">contenus <span id="nombre-contenus">0</span></button>
      </nav>

      <section id="vue-propositions" class="vue-admin">
        <div class="barre">
          <div class="filtres" role="group" aria-label="Filtrer les propositions">
            <button class="filtre actif" data-statut="all" type="button">toutes</button>
            <button class="filtre" data-statut="pending" type="button">en attente</button>
            <button class="filtre" data-statut="approved" type="button">validées</button>
            <button class="filtre" data-statut="rejected" type="button">refusées</button>
          </div>
          <button class="bouton" id="rafraichir" type="button">actualiser</button>
        </div>
        <div id="liste-propositions" class="liste-propositions"></div>
      </section>

      <section id="vue-contenus" class="vue-admin" hidden>
        <form id="contenu-forme" class="contenu-forme">
          <input id="contenu-id" type="hidden">
          <div class="contenu-forme-entete">
            <div>
              <p class="micro">mini-CMS</p>
              <h2 id="contenu-forme-titre">AJOUTER UN CONTENU</h2>
            </div>
            <button class="bouton" id="contenu-annuler" type="button" hidden>annuler</button>
          </div>
          <div class="grille-forme">
            <label>clé technique<input id="contenu-cle" required pattern="[a-z0-9][a-z0-9._-]{1,79}" placeholder="section.manifeste"></label>
            <label>type
              <select id="contenu-type">
                <option value="intro">introduction</option>
                <option value="paragraph">paragraphe</option>
                <option value="quote">citation</option>
                <option value="section">section</option>
                <option value="fragment">fragment vivant</option>
              </select>
            </label>
            <label>titre<input id="contenu-titre" maxlength="160"></label>
            <label>ordre<input id="contenu-ordre" type="number" value="0" min="-10000" max="10000"></label>
          </div>
          <label>texte<textarea id="contenu-valeur" rows="6" maxlength="12000" required></textarea></label>
          <label class="publie"><input id="contenu-publie" type="checkbox" checked> publié sur le site</label>
          <div class="actions-forme">
            <button class="bouton bouton--plein" type="submit">enregistrer</button>
            <span id="contenu-message" class="message" role="status"></span>
          </div>
        </form>
        <div id="liste-contenus" class="liste-contenus"></div>
      </section>
    </section>
  </main>

  <div id="notification" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
